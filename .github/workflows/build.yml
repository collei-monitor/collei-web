name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_TITLE: Collei Monitor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG=${GITHUB_REF_NAME}
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "Previous tag: ${PREVIOUS_TAG}"
          
          if [ -z "${PREVIOUS_TAG}" ]; then
            LOG=$(git log --pretty=format:"* %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..${CURRENT_TAG})
          fi
          
          {
            echo "## What's Changed"
            echo ""
            echo "${LOG}"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
          } > CHANGELOG.md
          
          cat CHANGELOG.md

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Package dist
        run: |
          cd dist
          tar -czf ../collei-web-${{ github.ref_name }}.tar.gz .
          cd ..
          zip -r collei-web-${{ github.ref_name }}.zip dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            collei-web-${{ github.ref_name }}.tar.gz
            collei-web-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md